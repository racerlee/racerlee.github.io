education:
  title: 學歷 EDUCATION
  info:
  - degree: B.S. in Chemical Engineering
    university: National Cheng Kung University (NCKU)
    time: 2022 - 2026
    details: |
      在高中時因同時對物理跟化學有興趣，而選擇了會廣泛應用到兩者、且出路多元的化工系，希望可以在就讀的四年間探索並找到未來的方向。
      就讀期間修習了單元操作、物理化學、有機化學、化工熱力學、化學反應工程等課程，系上的實驗課程與專題報告讓我在大學部就訓練了實驗手法與報告撰寫能力。
      我研究的方向為半導體材料，研究其用於氧化與還原反應，如產生氫能源或降解污染物，研究結果可參考我的專題報告，期望在碩士學位有更進一步的研究成果。 <br> <br> During senior high school, I have strong interests in both physics and chemistry. 
      Therefore, I decided to study chemical engineering, which combines two fields and provides many career paths. 
      During my four years of study, I have taken courses such as Unit Operations, Physical Chemistry, Organic Chemistry, Chemical Engineering Thermodynamics, and Chemical Reaction Engineering. 
      Through laboratory classes and project reports, I gained hands-on experimental skills and experience in writing scientific reports. 
      My research focuses on semiconductor materials and their applications in oxidation and reduction reactions, such as hydrogen evolution and pollutant degradation. 
      The results of my work can be found in my undergraduate project, and I hope to continue and expand this research during my master’s degree.
  - degree: 國立宜蘭高級中學
    university: National Yilan Senior High School
    time: 2019 - 2022
    details: |
      

